<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - HishabPati</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="backdrop" aria-hidden="true">
    <div class="blob a"></div>
    <div class="blob b"></div>
    <div class="blob c"></div>
</div>
<div class="grid-overlay" aria-hidden="true"></div>

<main class="auth-page">
    <div class="auth-card">
        <a class="auth-logo" th:href="@{/}">
            <span class="logo-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1z"/>
                    <path d="M8 8h8M8 12h8M8 16h5"/>
                </svg>
            </span>
            <span class="auth-brand">Hishab<em>Pati</em></span>
        </a>
        <form th:action="@{/signup}" method="post">
            <h1 class="form-title">Create your account</h1>
            <p class="form-subtitle">Start tracking your expenses today</p>

            <div class="alert" th:if="${error}" th:text="${error}">Email already registered.</div>

            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Sifat Mazib" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="At least 6 characters" minlength="6" required>

            <button class="btn btn-primary btn-block" type="submit">Sign Up</button>

            <p class="switch">Already have an account? <a th:href="@{/login}">Sign in</a></p>
        </form>
    </div>
</main>
</body>
</html>
