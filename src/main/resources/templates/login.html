<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - HishabPati</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="backdrop" aria-hidden="true">
    <div class="blob a"></div>
    <div class="blob b"></div>
    <div class="blob c"></div>
</div>
<div class="grid-overlay" aria-hidden="true"></div>

<main class="auth-page">
    <div class="auth-card">
        <a class="auth-logo" th:href="@{/}">
            <span class="logo-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1z"/>
                    <path d="M8 8h8M8 12h8M8 16h5"/>
                </svg>
            </span>
            <span class="auth-brand">Hishab<em>Pati</em></span>
        </a>
        <form th:action="@{/login}" method="post">
            <h1 class="form-title">Welcome back</h1>
            <p class="form-subtitle">Sign in to your HishabPati account</p>

            <div class="alert" th:if="${param.error}">Invalid email or password.</div>
            <div class="alert success" th:if="${param.logout}">You have been logged out.</div>
            <div class="alert success" th:if="${param.registered}">Account created! Please sign in.</div>

            <label for="username">Email</label>
            <input type="email" id="username" name="username" placeholder="you@example.com" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Your password" required>

            <button class="btn btn-primary btn-block" type="submit">Sign In</button>

            <p class="switch">New here? <a th:href="@{/signup}">Create an account</a></p>
        </form>
    </div>
</main>
</body>
</html>
