<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - HishabPati</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="center-col container">
    <form class="card" th:action="@{/login}" method="post">
        <h1 class="form-title">Welcome back</h1>
        <p class="form-subtitle">Sign in to your HishabPati account</p>

        <div class="alert" th:if="${param.error}">Invalid email or password.</div>
        <div class="alert success" th:if="${param.logout}">You have been logged out.</div>
        <div class="alert success" th:if="${param.registered}">Account created! Please sign in.</div>

        <label for="username">Email</label>
        <input type="email" id="username" name="username" placeholder="you@example.com" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Your password" required>

        <button class="btn btn-primary btn-block" type="submit">Sign In</button>

        <p class="switch">New here? <a th:href="@{/signup}">Create an account</a></p>
    </form>
</main>
</body>
</html>
