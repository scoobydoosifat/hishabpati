<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses - HishabPati</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="backdrop" aria-hidden="true">
    <div class="blob a"></div>
    <div class="blob b"></div>
    <div class="blob c"></div>
</div>
<div class="grid-overlay" aria-hidden="true"></div>

<nav class="navbar">
    <div class="navbar-inner">
        <a class="brand" th:href="@{/dashboard}">
            <span class="logo-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1z"/>
                    <path d="M8 8h8M8 12h8M8 16h5"/>
                </svg>
            </span>
            Hishab<em>Pati</em>
        </a>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
        <div class="nav-menu" id="navMenu">
            <div class="nav-links">
                <a th:href="@{/dashboard}">Dashboard</a>
                <a class="active" th:href="@{/expenses}">Expenses</a>
                <span class="nav-user" th:text="${user.name}">User</span>
                <form class="inline-form" th:action="@{/logout}" method="post">
                    <button class="btn btn-ghost" type="submit">Logout</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<main class="container">
    <h1 class="page-title"><span class="gradient-text">Expenses</span></h1>
    <p class="page-subtitle">Add, edit or remove your day-to-day expenses.</p>

    <form class="card" th:if="${editing == null}" th:action="@{/expenses}" method="post">
        <h2>
            <span class="card-ico">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
            </span>
            Add New Expense
        </h2>
        <div class="form-grid">
            <div>
                <label for="title">Title</label>
                <input type="text" id="title" name="title" placeholder="Friday lunch" required>
            </div>
            <div>
                <label for="amount">Amount (৳)</label>
                <input type="number" id="amount" name="amount" step="0.01" min="0" placeholder="250" required>
            </div>
            <div>
                <label for="category">Category</label>
                <select id="category" name="category">
                    <option th:each="c : ${categories}" th:value="${c}" th:text="${c}">FOOD</option>
                </select>
            </div>
            <div>
                <label for="date">Date</label>
                <input type="date" id="date" name="date">
            </div>
            <div class="full">
                <label for="note">Note (optional)</label>
                <input type="text" id="note" name="note" placeholder="Paid with bKash">
            </div>
        </div>
        <div class="form-actions">
            <button class="btn btn-primary" type="submit">Add Expense</button>
        </div>
    </form>

    <form class="card" th:if="${editing != null}" th:action="@{/expenses/{id}(id=${editing.id})}" method="post">
        <h2>
            <span class="card-ico amber">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
            </span>
            Edit Expense
        </h2>
        <div class="form-grid">
            <div>
                <label for="title">Title</label>
                <input type="text" id="title" name="title" th:value="${editing.title}" required>
            </div>
            <div>
                <label for="amount">Amount (৳)</label>
                <input type="number" id="amount" name="amount" step="0.01" min="0" th:value="${editing.amount}" required>
            </div>
            <div>
                <label for="category">Category</label>
                <select id="category" name="category">
                    <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"
                            th:selected="${editing.category == c}">FOOD</option>
                </select>
            </div>
            <div>
                <label for="date">Date</label>
                <input type="date" id="date" name="date" th:value="${editing.date}">
            </div>
            <div class="full">
                <label for="note">Note (optional)</label>
                <input type="text" id="note" name="note" th:value="${editing.note}">
            </div>
        </div>
        <div class="form-actions">
            <button class="btn btn-primary" type="submit">Save Changes</button>
            <a class="btn btn-ghost" th:href="@{/expenses}">Cancel</a>
        </div>
    </form>

    <section class="card">
        <h2>
            <span class="card-ico">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18M3 12h18M3 18h12"/>
                </svg>
            </span>
            All Expenses
        </h2>
        <div class="empty" th:if="${#lists.isEmpty(expenses)}">No expenses yet. Add your first one above!</div>
        <div class="table-wrap" th:if="${!#lists.isEmpty(expenses)}">
            <table class="table">
                <thead>
                <tr>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Date</th>
                    <th class="actions">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="expense : ${expenses}">
                    <td th:text="${expense.title}">Lunch</td>
                    <td><span class="badge" th:text="${expense.category}">FOOD</span></td>
                    <td class="amount" th:text="${'৳ ' + #numbers.formatDecimal(expense.amount, 1, 2)}">৳ 0.00</td>
                    <td class="date" th:text="${expense.date}">2026-09-23</td>
                    <td class="actions">
                        <form class="inline-form" th:action="@{/expenses/{id}/delete(id=${expense.id})}" method="post"
                              onsubmit="return confirm('Delete this expense?');">
                            <button class="btn btn-small btn-danger" type="submit">Delete</button>
                        </form>
                        <a class="btn btn-small" th:href="@{/expenses/{id}/edit(id=${expense.id})}">Edit</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<script>
    // Mobile menu toggle
    var navToggle = document.getElementById('navToggle');
    var navMenu = document.getElementById('navMenu');
    function closeMenu() {
        navMenu.classList.remove('open');
        navToggle.classList.remove('active');
        navToggle.setAttribute('aria-expanded', 'false');
        document.body.style.overflow = '';
    }
    navToggle.addEventListener('click', function () {
        var open = navMenu.classList.toggle('open');
        navToggle.classList.toggle('active', open);
        navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        document.body.style.overflow = open ? 'hidden' : '';
    });
    navMenu.querySelectorAll('a, form').forEach(function (el) {
        el.addEventListener('click', closeMenu);
    });
    window.addEventListener('pointerdown', function (e) {
        if (!navMenu.classList.contains('open')) return;
        if (!navMenu.contains(e.target) && !navToggle.contains(e.target)) closeMenu();
    });
    window.addEventListener('resize', function () {
        if (window.innerWidth > 900) closeMenu();
    });
</script>
</body>
</html>
